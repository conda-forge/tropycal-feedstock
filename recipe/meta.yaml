{% set name = "tropycal" %}
{% set version = "1.5" %}


package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tropycal-{{ version }}.tar.gz
  sha256: a16660422ea02fa363260a790ef62358c02ca41f28e7a1684464df3b93f42f8c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools_scm
  run:
    - pyshp >=2.1
    - matplotlib-base >=3.3.2
    - networkx >=2.5.0
    - numpy >=1.18.0
    - pandas >=1.3.0
    - python >={{ python_min }}
    - requests >=2.22.0
    - scipy >=1.5.0
    - xarray >=0.16.0

test:
  imports:
    - tropycal
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tropycal/tropycal
  summary: Package for retrieving and analyzing tropical cyclone data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tomerburg
    - raybellwaves
